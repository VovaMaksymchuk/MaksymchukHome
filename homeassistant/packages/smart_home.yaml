# =====================================================================
#  Розумний будинок (Tuya через HA) → Firebase + команди з дашборда
#  Файл: /config/packages/smart_home.yaml
#
#  Використовує rest_command.firebase_put / firebase_delete та
#  sensor.firebase_token, визначені в home_dashboard.yaml — обидва файли
#  вантажаться як один пакет (packages: !include_dir_named packages),
#  тож достатньо задати ці ключі один раз.
#
#  Напрямок даних:
#   • home/switches, home/climate, home/sensors — HA → Firebase, читає дашборд.
#   • home/commands/* — дашборд → Firebase, читає й виконує HA (раз на 3с),
#     після виконання видаляє запис і одразу пушить підтверджений стан.
#
#  ⚙️ entity_id нижче вже підставлені під цю квартиру (Tuya). Ключі зліва
#  (living/bedroom/office/hallway, boiler/floor, bathroom/kitchen/hallway) —
#  фіксовані, бо на них зав'язаний дашборд (public/config.js: rooms,
#  climateDevices, sensorGroups) — не перейменовуй їх тут.
#  Список кімнат/пристроїв повторюється в кількох місцях нижче — міняй скрізь.
# =====================================================================

rest_command:
  # GET з Firebase — для читання команд дашборда. ⚙️ той самий DB URL, що в home_dashboard.yaml.
  firebase_get:
    url: >-
      https://maksymchukhome-default-rtdb.europe-west1.firebasedatabase.app/{{ path }}.json?auth={{ state_attr('sensor.firebase_token', 'id_token') }}
    method: GET
    timeout: 15

script:
  # ---------- Стан вимикачів світла → /home/switches ----------
  smart_home_push_switches:
    alias: "Smart home: push switches"
    mode: single
    max_exceeded: silent
    variables:
      # ⚙️ Світло керується сценами Tuya «💡» (scene.*), а стан «горить/ні»
      # береться з вимикачів кімнати: увімкнено, якщо горить хоч один.
      rooms:
        living:  { scene: scene.vitalnia, state: [switch.svitlo_vitalnia_switch_1] }   # Вітальня
        bedroom: { scene: scene.spalnia,  state: [switch.svitlo_spalnia_switch_1] }    # Спальня
        office:  { scene: scene.kabinet,  state: [switch.svitlo_kabinet_switch_1] }    # Кабінет
        hallway: { scene: scene.koridor,  state: [switch.koridor_vimikach_switch_2] }  # Коридор
    sequence:
      - repeat:
          for_each: "{{ rooms | list }}"
          sequence:
            - action: rest_command.firebase_put
              continue_on_error: true
              data:
                path: "home/switches/{{ repeat.item }}"
                body:
                  "on": "{{ rooms[repeat.item].state | select('is_state', 'on') | list | count > 0 }}"
                  ts: { ".sv": "timestamp" }

  # ---------- Котел + тепла підлога (поточна/цільова температура) → /home/climate ----------
  smart_home_push_climate:
    alias: "Smart home: push climate"
    mode: single
    max_exceeded: silent
    variables:
      devices:
        boiler: climate.opalennia         # ⚙️ Котел
        floor: climate.tepla_pidloga   # ⚙️ Тепла підлога
      # ⚙️ клапан «гріє зараз» (climate від Tuya не дає hvac_action)
      valves:
        boiler: binary_sensor.opalennia_valve
    sequence:
      - repeat:
          for_each: "{{ devices | list }}"
          sequence:
            - action: rest_command.firebase_put
              continue_on_error: true
              data:
                path: "home/climate/{{ repeat.item }}"
                body:
                  current: "{{ state_attr(devices[repeat.item], 'current_temperature') }}"
                  target: "{{ state_attr(devices[repeat.item], 'temperature') }}"
                  mode: "{{ states(devices[repeat.item]) }}"
                  heating: "{{ is_state(valves[repeat.item], 'on') if repeat.item in valves else none }}"
                  ts: { ".sv": "timestamp" }

  # ---------- Датчики диму/протікання → /home/sensors ----------
  smart_home_push_sensors:
    alias: "Smart home: push leak/smoke sensors"
    mode: single
    max_exceeded: silent
    variables:
      leak:
        bathroom: binary_sensor.datchik_vodi_vanna_moisture   # ⚙️ Ванна
        kitchen: binary_sensor.datchik_vodi_kukhnia_moisture     # ⚙️ Кухня
      smoke:
        hallway: binary_sensor.datchik_dimu_smoke    # ⚙️ Коридор
    sequence:
      - repeat:
          for_each: "{{ leak | list }}"
          sequence:
            - action: rest_command.firebase_put
              continue_on_error: true
              data:
                path: "home/sensors/leak/{{ repeat.item }}"
                body:
                  alarm: "{{ is_state(leak[repeat.item], 'on') }}"
                  ts: { ".sv": "timestamp" }
      - repeat:
          for_each: "{{ smoke | list }}"
          sequence:
            - action: rest_command.firebase_put
              continue_on_error: true
              data:
                path: "home/sensors/smoke/{{ repeat.item }}"
                body:
                  alarm: "{{ is_state(smoke[repeat.item], 'on') }}"
                  ts: { ".sv": "timestamp" }

automation:
  # ---------- Періодичний пуш стану (кожні 10с) ----------
  - id: smart_home_push_periodic
    alias: "Smart home: періодичний пуш стану"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/10"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: sensor.firebase_token
        state: "ok"
    actions:
      - action: script.smart_home_push_switches
      - action: script.smart_home_push_climate
      - action: script.smart_home_push_sensors

  # ---------- Виконання команд із дашборда (кожні 3с) ----------
  # Дашборд пише в home/commands/switches/<id> і home/commands/climate/<id>;
  # тут читаємо, виконуємо через Tuya-сутності, видаляємо команду, пушимо новий стан.
  - id: smart_home_commands
    alias: "Smart home: виконання команд із дашборда"
    mode: single
    max_exceeded: silent
    variables:
      rooms:   # ⚙️ той самий список, що в smart_home_push_switches
        living:  { scene: scene.vitalnia, state: [switch.svitlo_vitalnia_switch_1] }
        bedroom: { scene: scene.spalnia,  state: [switch.svitlo_spalnia_switch_1] }
        office:  { scene: scene.kabinet,  state: [switch.svitlo_kabinet_switch_1] }
        hallway: { scene: scene.koridor,  state: [switch.koridor_vimikach_switch_2] }
      climate_devices:
        boiler: climate.opalennia          # ⚙️ той самий список, що в smart_home_push_climate
        floor: climate.tepla_pidloga
    triggers:
      - trigger: time_pattern
        seconds: "/3"
    conditions:
      - condition: state
        entity_id: sensor.firebase_token
        state: "ok"
    actions:
      - action: rest_command.firebase_get
        continue_on_error: true
        data:
          path: "home/commands/switches"
        response_variable: sw_cmds
      - variables:
          # rest_command сам парсить JSON-відповідь у dict; null (команд нема) — не mapping
          switch_cmds: >-
            {{ sw_cmds.content
               if (sw_cmds is defined and sw_cmds.status == 200 and sw_cmds.content is mapping)
               else {} }}
      - repeat:
          for_each: "{{ switch_cmds | list }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item in rooms }}"
              then:
                # Сцена лише перемикає, тож запускаємо її тільки коли стан справді
                # має змінитись — інакше повторна команда вимкнула б світло назад.
                - if:
                    - condition: template
                      value_template: >-
                        {{ (rooms[repeat.item].state | select('is_state', 'on') | list | count > 0)
                           != (switch_cmds[repeat.item].on | bool) }}
                  then:
                    - action: scene.turn_on
                      target:
                        entity_id: "{{ rooms[repeat.item].scene }}"
                    # дати Tuya відпрацювати, щоб пуш нижче вже бачив новий стан
                    - delay: "00:00:02"
                - action: rest_command.firebase_delete
                  continue_on_error: true
                  data:
                    path: "home/commands/switches/{{ repeat.item }}"
      - action: rest_command.firebase_get
        continue_on_error: true
        data:
          path: "home/commands/climate"
        response_variable: cl_cmds
      - variables:
          climate_cmds: >-
            {{ cl_cmds.content
               if (cl_cmds is defined and cl_cmds.status == 200 and cl_cmds.content is mapping)
               else {} }}
      - repeat:
          for_each: "{{ climate_cmds | list }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item in climate_devices }}"
              then:
                # mode — лише коли дашборд прислав його (напр. тепла підлога: увімк./вимк.).
                # Спершу режим (вимкнений Tuya-термостат може ігнорувати уставку).
                # Дашборд шле "heat"/"off"; Tuya часто має лише off/heat_cool —
                # беремо режим, який пристрій справді підтримує.
                - if:
                    - condition: template
                      value_template: "{{ 'mode' in climate_cmds[repeat.item] }}"
                  then:
                    - variables:
                        ent: "{{ climate_devices[repeat.item] }}"
                        want: "{{ climate_cmds[repeat.item].mode }}"
                        modes: "{{ state_attr(ent, 'hvac_modes') or [] }}"
                    - action: climate.set_hvac_mode
                      continue_on_error: true
                      target:
                        entity_id: "{{ ent }}"
                      data:
                        hvac_mode: >-
                          {{ want if want in modes
                             else ('off' if want == 'off'
                                   else (modes | reject('eq', 'off') | first | default(want))) }}
                # Уставку — лише якщо це не вимкнення: Tuya-термостат від set_temperature
                # вмикається знову, і команда «вимкнути» не спрацьовувала б.
                - if:
                    - condition: template
                      value_template: "{{ climate_cmds[repeat.item].mode | default('') != 'off' }}"
                  then:
                    - action: climate.set_temperature
                      # помилка не повинна лишати команду в базі (інакше повтор кожні 3 с)
                      continue_on_error: true
                      target:
                        entity_id: "{{ climate_devices[repeat.item] }}"
                      data:
                        temperature: "{{ climate_cmds[repeat.item].target }}"
                - action: rest_command.firebase_delete
                  continue_on_error: true
                  data:
                    path: "home/commands/climate/{{ repeat.item }}"
      # Tuya оновлює стан термостата із запізненням — дати 2 с, щоб на дашборд
      # пішов уже новий стан (інакше він «відскакує» і хочеться натиснути ще раз)
      - if:
          - condition: template
            value_template: "{{ climate_cmds | count > 0 }}"
        then:
          - delay: "00:00:02"
      - action: script.smart_home_push_switches
      - action: script.smart_home_push_climate
