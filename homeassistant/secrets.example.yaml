# Додай ці рядки у /config/secrets.yaml (НЕ в packages/).
#
# API key: Firebase console → Project settings → General → Web API Key
# (той самий, що в public/config.js — він не секретний, але тримаємо разом)
firebase_signin_url: "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=YOUR_WEB_API_KEY"

# Окремий користувач для HA: Firebase console → Authentication → Users → Add user
# Пароль — довгий випадковий. Цей користувач має право лише ПИСАТИ в /home.
firebase_signin_payload: '{"email":"ha@home.local","password":"CHANGE-ME-long-random-password","returnSecureToken":true}'
