<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Квартира · енергія</title>
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Квартира">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- loading -->
  <div data-screen="loading" class="center-screen"><div class="spinner" aria-label="Завантаження"></div></div>

  <!-- login -->
  <main data-screen="login" class="center-screen" hidden>
    <div class="card auth">
      <img src="icon.svg" alt="" width="56" height="56">
      <h1>Квартира</h1>
      <p class="muted">Стан інвертора, батареї та графік світла</p>
      <form id="pin-form" class="form" autocomplete="on">
        <input type="text" name="username" value="home" autocomplete="username" hidden>
        <input id="pin-input" name="pin" type="password" inputmode="numeric" placeholder="Пароль"
               autocomplete="current-password" required aria-describedby="pin-status">
        <button class="btn btn--primary" id="pin-submit" type="submit">Увійти</button>
      </form>
      <div id="pin-status" class="pin-status small" role="status" aria-live="polite"></div>
      <div class="divider"><span>або</span></div>
      <button class="btn btn--google" id="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Увійти через Google
      </button>
    </div>
  </main>

  <!-- no access -->
  <main data-screen="noaccess" class="center-screen" hidden>
    <div class="card auth">
      <h1>Немає доступу</h1>
      <p class="muted">Ви увійшли як <b id="who"></b>, але цей акаунт ще не додано до переглядачів.</p>
      <p class="small">У Firebase console → Realtime Database → Data додай:<br>
        <code>access/viewers/<span id="uid"></span></code> = <code>true</code></p>
      <div class="row">
        <button class="btn" id="btn-copy-uid">Скопіювати UID</button>
        <button class="btn" data-signout>Вийти</button>
      </div>
    </div>
  </main>

  <!-- app -->
  <div data-screen="app" hidden>
    <header class="topbar">
      <h1 id="title">Квартира</h1>
      <span id="demo-badge" class="chip chip--muted" hidden>демо</span>
      <span id="live-chip" class="chip chip--muted">…</span>
    </header>
    <div id="stale-banner" class="banner" hidden></div>
    <nav class="tabbar" role="tablist">
      <button role="tab" data-panel="status" aria-selected="true">Стан</button>
      <button role="tab" data-panel="light">Світло</button>
      <button role="tab" data-panel="power">Електрика</button>
    </nav>

    <main class="grid" data-panel="status">
      <section id="hero" class="card hero" aria-live="polite"></section>
      <section id="flow" class="card" aria-live="polite" hidden></section>
      <section id="climate" class="card"></section>
      <section id="sensors" class="card"></section>
    </main>

    <main class="grid" data-panel="light" hidden>
      <section id="switches" class="card span-2"></section>
    </main>

    <main class="grid" data-panel="power" hidden>
      <section id="battery" class="card"></section>
      <section id="inverter" class="card"></section>
      <section id="timeline" class="card span-2"></section>
      <section id="charts" class="card"></section>
      <section id="stats" class="card"></section>
      <section id="log" class="card span-2"></section>
    </main>
    <footer class="footer muted small">
      <span id="footer-time"></span>
      <button class="link" data-signout>Вийти</button>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
